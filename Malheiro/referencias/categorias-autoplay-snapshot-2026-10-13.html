#fm-categorias .fm-foot{display:flex;gap:8px;align-items:center;justify-content:space-between;min-height:52px;padding:12px 13px;background:#fff;text-align:left}
#fm-categorias .fm-name{font:700 14px/1.25 Arial,Helvetica,sans-serif;color:#123c70;min-width:0}
#fm-categorias .fm-arrow{display:grid;place-items:center;flex:0 0 27px;width:27px;height:27px;background:#eef4fd;border-radius:50%;font:700 19px/1 Arial,Helvetica,sans-serif;color:#174a8e}
#fm-categorias .fm-mobile-hint{display:none}
#fm-categorias .fm-card:focus-visible{outline:3px solid #1366b7;outline-offset:3px}
@media(hover:hover) and (pointer:fine){#fm-categorias .fm-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(11,37,72,.11)}#fm-categorias .fm-card:hover .fm-arrow{background:#dceafc}}
@media(max-width:1120px){#fm-categorias .fm-track{grid-auto-columns:calc((100% - 32px)/3)}}
@media(max-width:780px){#fm-categorias .fm-track{grid-auto-columns:calc((100% - 16px)/2)}}
@media(max-width:600px){
 #fm-categorias{padding:0 14px;margin:26px auto 32px}
 #fm-categorias .fm-head{margin-bottom:14px;align-items:center;gap:8px}
 #fm-categorias .fm-control{width:34px;height:34px;font-size:20px}
 #fm-categorias .fm-heading{font-size:24px}
 #fm-categorias .fm-description{font-size:13px}
 #fm-categorias .fm-mobile-hint{display:block;margin:8px 0 0;color:#45658c;font-size:12px}
 #fm-categorias .fm-track{grid-auto-columns:min(320px,78vw);gap:12px}
 #fm-categorias .fm-foot{min-height:50px}
 #fm-categorias .fm-name{font-size:15px}
}
@media(max-width:350px){#fm-categorias .fm-track{grid-auto-columns:83vw}}
@media(prefers-reduced-motion:reduce){#fm-categorias .fm-card{transition:none}#fm-categorias .fm-card:hover{transform:none}#fm-categorias .fm-track{scroll-behavior:auto}}
</style>

<script>
/* Instalação via Rodapé da Loja Integrada: posiciona a seção imediatamente após .secao-banners. */
(function(){
  function posicionar(){
    var sec = document.getElementById('fm-categorias');
    var banner = document.querySelector('#corpo .secao-banners, .pagina-inicial .secao-banners, .secao-banners');
    if (!sec || !banner || !banner.parentNode) return false;
    // Move a seção existente, não a duplica; a posição fica depois de TODO o bloco dos banners.
    if (banner.nextElementSibling !== sec) banner.insertAdjacentElement('afterend', sec);
    sec.dataset.fmPosicionado = 'apos-banner-principal';
    return true;
  }
  function aguardarBanner(){
    if (posicionar() || !('MutationObserver' in window)) return;
    // O tema pode carregar o banner depois do HTML personalizado.
    var observador = new MutationObserver(function(){
      if (posicionar()) observador.disconnect();
    });
    observador.observe(document.documentElement, { childList: true, subtree: true });
    window.setTimeout(function(){ observador.disconnect(); }, 12000);
  }
  function ativarCarrossel(){
    var sec=document.getElementById('fm-categorias');
    if(!sec || sec.dataset.fmCarousel) return;
    sec.dataset.fmCarousel='1';
    var track=sec.querySelector('.fm-track');
    var itens=Array.prototype.slice.call(sec.querySelectorAll('.fm-item'));
    var anterior=sec.querySelector('.fm-prev');
    var proximo=sec.querySelector('.fm-next');
    if(!track || itens.length<2) return;

    var visivel=true, comMouse=false, comFoco=false, arrastando=false;
    var ultimaInteracao=0;
    var reduzMovimento=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
    var intervalo=4800; // Troque para 6000 para passar a cada 6 segundos
    var pausaManual=12000; // Aguarda 12s após uma interação manual

    function larguraMaxima(){return Math.max(0,track.scrollWidth-track.clientWidth);}
    function posicao(item){
      return track.scrollLeft+item.getBoundingClientRect().left-track.getBoundingClientRect().left;
    }
    function mover(para){
      track.scrollTo({left:Math.max(0,Math.min(larguraMaxima(),para)),behavior:reduzMovimento && reduzMovimento.matches?'auto':'smooth'});
    }
    function navegar(direcao){
      var atual=track.scrollLeft, limite=larguraMaxima();
      if(limite<4) return;
      if(direcao>0){
        if(atual>=limite-5){mover(0);return;}
        for(var i=0;i<itens.length;i++){
          var destino=posicao(itens[i]);
          if(destino>atual+5){mover(destino);return;}
        }
        mover(0);
      }else{
        if(atual<=5){mover(limite);return;}
        for(var j=itens.length-1;j>=0;j--){
          var voltar=posicao(itens[j]);
          if(voltar<atual-5){mover(voltar);return;}
        }
        mover(0);
      }
    }
    function interromper(){ultimaInteracao=Date.now();}
    if(anterior) anterior.addEventListener('click',function(){interromper();navegar(-1);});
    if(proximo) proximo.addEventListener('click',function(){interromper();navegar(1);});
    track.addEventListener('pointerdown',function(){arrastando=true;interromper();});
    document.addEventListener('pointerup',function(){arrastando=false;});
    document.addEventListener('pointercancel',function(){arrastando=false;});
    track.addEventListener('wheel',interromper,{passive:true});
    track.addEventListener('keydown',interromper);
    sec.addEventListener('mouseenter',function(){comMouse=true;});
    sec.addEventListener('mouseleave',function(){comMouse=false;});
    sec.addEventListener('focusin',function(){comFoco=true;interromper();});
    sec.addEventListener('focusout',function(){comFoco=false;});
    if('IntersectionObserver' in window){
      new IntersectionObserver(function(e){visivel=e[0].isIntersecting;},{threshold:0.15}).observe(sec);
    }
    window.setInterval(function(){
      if((reduzMovimento && reduzMovimento.matches) || document.hidden || !visivel || comMouse || comFoco || arrastando || Date.now()-ultimaInteracao<pausaManual) return;
      navegar(1);
    },intervalo);
  }
  function iniciar(){aguardarBanner();ativarCarrossel();}
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',iniciar);}else{iniciar();}
})();
</script>
