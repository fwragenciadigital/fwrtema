<style>
  .sr-only{position:absolute!important;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  :root{
    --qz-bg:#fff; --qz-border:#eaeaea; --qz-bot:#f5f7fb; --qz-user:#dff4ff;
    --qz-text:#1a1a1a; --qz-accent:#0aa2ff; --qc-z:9999;
  }
  .qc-trigger{
    position:fixed; right:16px; bottom:calc(88px + env(safe-area-inset-bottom));
    z-index:var(--qc-z);
    display:flex; align-items:center; gap:8px;
    background:var(--qz-accent); color:#fff; border:0; border-radius:999px;
    padding:5px 7px; box-shadow:0 8px 24px rgba(0,0,0,.18); cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .qc-trigger:hover{ transform:translateY(-1px); box-shadow:0 12px 30px rgba(0,0,0,.22) }
  .qc-trigger__icon{ display:inline-grid; place-items:center; width:26px; height:26px; border-radius:999px; background:#fff2 }
  .qc-trigger__label{ font-weight:600; font-size:12px }
  .qc-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.35);
    z-index:calc(var(--qc-z) - 1);
    pointer-events:auto;
  }
  .qc-drawer{
    position:fixed; top:0; right:0; height:100vh; width:min(92vw, 380px);
    background:#fff; z-index:var(--qc-z);
    box-shadow:-8px 0 24px rgba(0,0,0,.18);
    transform:translateX(100%); transition:transform .2s ease;
    display:flex; flex-direction:column;
    pointer-events:auto;
  }
  .qc-drawer[aria-hidden="false"]{ transform:translateX(0) }
  .qc-drawer, .qc-drawer *{ pointer-events:auto; }

  .qc-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; border-bottom:1px solid var(--qz-border);
  }
  .qc-header h3{ margin:0; font-size:1rem }
  .qc-close{ border:1px solid var(--qz-border); background:#fff; border-radius:8px; padding:6px 10px; cursor:pointer }
  .quizchat{ padding:12px; background:var(--qz-bg) }
  .quizchat__wrap{
    min-height:260px;
    max-height:calc(100vh - 170px);
    overflow:auto;
    display:flex; flex-direction:column; gap:8px;
  }
  .quizchat__msg{ max-width:86%; border-radius:14px; padding:10px 12px; line-height:1.35; color:var(--qz-text) }
  .quizchat__msg--bot{ background:var(--qz-bot); border:1px solid var(--qz-border); align-self:flex-start }
  .quizchat__msg--user{ background:var(--qz-user); border:1px solid #cfefff; align-self:flex-end }
  .quizchat__quick{ display:flex; flex-wrap:wrap; gap:8px; margin-top:2px }
  .quizchat__btn{ border:1px solid var(--qz-border); background:#fff; border-radius:999px; padding:8px 12px; cursor:pointer;
    transition:transform .12s, box-shadow .12s; }
  .quizchat__btn:hover{ transform:translateY(-1px); box-shadow:0 2px 8px rgba(0,0,0,.06) }
  .quizchat__btn[aria-pressed="true"]{ background:var(--qz-accent); color:#fff; border-color:var(--qz-accent) }
  .quizchat__cta{ display:inline-flex; align-items:center; gap:8px; border-radius:10px; padding:10px 14px;
    border:1px solid var(--qz-accent); color:#fff; background:var(--qz-accent); text-decoration:none }
  .quizchat__footer{ display:flex; justify-content:flex-end; margin-top:8px }
  .quizchat__restart{ border:1px solid var(--qz-border); background:#fff; border-radius:8px; padding:8px 10px; cursor:pointer }
  .quizchat__typing{ display:inline-flex; gap:4px }
  .quizchat__dot{ width:6px; height:6px; background:#bbb; border-radius:999px; display:inline-block; animation:qzblink 1s infinite }
  .quizchat__dot:nth-child(2){ animation-delay:.15s } .quizchat__dot:nth-child(3){ animation-delay:.3s }
  @keyframes qzblink{ 0%,80%,100%{opacity:.25} 40%{opacity:1} }

  @media (max-width:480px){
    .qc-drawer{ width:100vw }
    .qc-trigger__label{ display:none }
  }
</style>

<button id="qc-trigger" class="qc-trigger" aria-haspopup="dialog" aria-controls="qc-drawer" aria-expanded="false">
  <span class="qc-trigger__icon">💊</span>
  <span class="qc-trigger__label">Ache seu suplemento</span>
</button>

<div id="qc-backdrop" class="qc-backdrop" hidden></div>

<aside id="qc-drawer" class="qc-drawer" role="dialog" aria-modal="true" aria-labelledby="qc-title" hidden aria-hidden="true">
  <header class="qc-header">
    <h3 id="qc-title">Assistente Farmacêutico Malheiro</h3>
    <button id="qc-close" class="qc-close" aria-label="Fechar">×</button>
  </header>

  <section id="quiz-caps" class="quizchat" aria-labelledby="quizc-title">
    <h4 id="quizc-title" class="sr-only">Quiz em cápsulas</h4>
    <div class="quizchat__wrap" role="region" aria-live="polite">
      <noscript>Ative o JavaScript para usar o assistente.</noscript>
    </div>
    <div class="quizchat__footer">
      <button type="button" class="quizchat__restart" aria-label="Reiniciar quiz">Reiniciar</button>
    </div>
  </section>
</aside>

<script defer>
(function(){
  'use strict';

  const WHATS_NUMBER = "5511912576135";
  const UTM = "utm_source=quiz&utm_medium=drawer&utm_campaign=malheiro_quiz";
  const INCLUDE_PAGE_URL = true; 
  const OPEN_WHATS_NEW_TAB = true;

  const MAPA = {
    ossea_articular: {
      rotulo: "Óssea/Articular",
      produtos: [
        { nome:"Vitamina D3 10.000 UI + Vitamina K2MK7 120 mcg", url:"https://www.farmaciamalheiro.com.br/vitamina-d3-10000-ui-vitamina-k2-mk7-120mcg-capsulas" },
        { nome:"Magnésio Quelado 500 mg", url:"https://www.farmaciamalheiro.com.br/magnesio-quelato-150-mg-capsulas" },
        { nome:"Magnésio Dimalato 500 mg", url:"https://www.farmaciamalheiro.com.br/produto/magnesio-dimalato-500-mg-capsulas.html" }
      ]
    },
    cardiovascular: {
      rotulo: "Cardiovascular",
      produtos: [
        { nome:"Vitamina D3 10.000 UI + Vitamina K2MK7 200 mcg", url:"https://www.farmaciamalheiro.com.br/vitamina-d3-10000-ui-vitamina-k2-mk7-200mcg-capsulas" },
        { nome:"Coenzima Q10 100 mg", url:"https://www.farmaciamalheiro.com.br/coenzima-q10-100mg-capsulas" },
        { nome:"Vitamina B12 (Metilcobalamina)", url:"https://www.farmaciamalheiro.com.br/metilcobalamina-1000-mcg-capsulas" }
      ]
    },
    mental_foco: {
      rotulo: "Foco & Concentração",
      produtos: [
        { nome:"Mag L Treonato 500 mg", url:"https://www.farmaciamalheiro.com.br/kit-memoria-omega-3-neural-mag-l-treonato-coenzima" },
        { nome:"Bacopa monnieri 500 mg", url:"https://www.farmaciamalheiro.com.br/bacopa-monnieri-500-mg-capsulas" },
        { nome:"Mix de magnésios (Treonato)", url:"https://www.farmaciamalheiro.com.br/mix-de-magnesio-treonato-dimalato-quelado-capsulas" }
      ]
    },
    energia_vitalidade: {
      rotulo: "Energia & Vitalidade",
      produtos: [
        { nome:"Coenzima Q10 200 mg", url:"https://www.farmaciamalheiro.com.br/coenzima-q10-200mg-capsulas" },
        { nome:"Complexo B concentrado", url:"https://www.farmaciamalheiro.com.br/complexo-b-concentrado-60-capsulas" },
        { nome:"Tribulus terrestris", url:"https://www.farmaciamalheiro.com.br/tribullus-terrestris-500mg-capsulas" }
      ]
    },
    memoria_concentracao: {
      rotulo: "Memória",
      produtos: [
        { nome:"Mix de magnésios (Treonato)", url:"https://www.farmaciamalheiro.com.br/mix-de-magnesio-treonato-dimalato-quelado-capsulas" }
      ]
    },
    termogenico: {
      rotulo: "Termogênico",
      produtos: [
        { nome:"Thermomax com cafeína", url:"https://www.farmaciamalheiro.com.br/termogenico-malheiro-com-cafeina-cafeina-capsiate-picolinato-de-cromo-farmacia-malheiro" }
      ]
    }
  };


  function withUtm(url){
    try{
      const u = new URL(url, location.origin);
      UTM.split('&').forEach(pair=>{
        const [k,v] = pair.split('=');
        if(k && v && !u.searchParams.has(k)) u.searchParams.set(k, v);
      });
      return u.toString();
    }catch(e){
      if(!UTM) return url;
      return url + (url.includes('?') ? '&' : '?') + UTM;
    }
  }

  function clarityEvent(name, data){
    try{
      if(window.clarity){
        if(data && typeof data === 'object'){
          Object.entries(data).forEach(([k,v]) => window.clarity('set', k, v));
        }
        window.clarity('event', name);
      }
    }catch(e){}
  }

  function ga4Event(name, params){
    try{
      if(typeof window.gtag === 'function'){
        window.gtag('event', name, params || {});
      }
    }catch(e){}
  }

  function buildWhatsUrl(goalLabel, products){
    const topNames = (products || []).slice(0, 3).map(p=>p.nome).join(", ");
    const page = INCLUDE_PAGE_URL ? "\n\nPágina: " + location.href : "";
    const msg =
`Olá! Vim através do quiz, estou em dúvida qual o melhor produto para "${goalLabel}".
Sugestões que apareceram pra mim: ${topNames}.${page}`;

    const text = encodeURIComponent(msg);
    return `https://wa.me/${WHATS_NUMBER}?text=${text}`;
  }

  const trigger  = document.getElementById('qc-trigger');
  const drawer   = document.getElementById('qc-drawer');
  const backdrop = document.getElementById('qc-backdrop');
  const closeBtn = document.getElementById('qc-close');

  function openDrawer(){
    drawer.hidden = false;
    backdrop.hidden = false;
    drawer.setAttribute('aria-hidden','false');
    trigger.setAttribute('aria-expanded','true');
    document.documentElement.style.overflow = 'hidden';
    clarityEvent('quiz_drawer_open');
    ga4Event('quiz_drawer_open');
    initQuizOnce();
    closeBtn && closeBtn.focus();
  }

  function closeDrawer(){
    drawer.setAttribute('aria-hidden','true');
    trigger.setAttribute('aria-expanded','false');
    setTimeout(()=>{ drawer.hidden = true; backdrop.hidden = true; }, 200);
    document.documentElement.style.overflow = '';
    clarityEvent('quiz_drawer_close');
    ga4Event('quiz_drawer_close');
  }

  trigger.addEventListener('click', openDrawer);
  closeBtn.addEventListener('click', closeDrawer);
  backdrop.addEventListener('click', closeDrawer);
  window.addEventListener('keydown', (e)=>{ if(e.key==='Escape' && drawer.hidden===false) closeDrawer(); });

  // ========= Chat =========
  let booted = false;
  function initQuizOnce(){ if(booted) return; booted = true; initQuiz(); }

  function initQuiz(){
    const elRoot  = document.getElementById('quiz-caps');
    const elWrap  = elRoot.querySelector('.quizchat__wrap');
    const elReset = elRoot.querySelector('.quizchat__restart');

    let lastGoal = null;

    function addMsg(html, who='bot'){
      const div = document.createElement('div');
      div.className = `quizchat__msg quizchat__msg--${who}`;
      div.innerHTML = html;
      elWrap.appendChild(div);
      elWrap.scrollTop = elWrap.scrollHeight;
      return div;
    }
    function addTyping(){
      const div = addMsg(`<span class="quizchat__typing" aria-hidden="true">
        <span class="quizchat__dot"></span><span class="quizchat__dot"></span><span class="quizchat__dot"></span>
      </span>`, 'bot');
      div.setAttribute('data-typing','1');
      return div;
    }
    function removeTyping(){
      const t = elWrap.querySelector('[data-typing="1"]');
      if(t) t.remove();
    }
    function quickReplies(options, onPick){
      const row = document.createElement('div'); row.className = 'quizchat__quick';
      options.forEach(opt=>{
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'quizchat__btn';
        b.textContent = opt.rotulo;
        b.addEventListener('click', ()=>{ b.setAttribute('aria-pressed','true'); onPick(opt); });
        row.appendChild(b);
      });
      elWrap.appendChild(row);
      elWrap.scrollTop = elWrap.scrollHeight;
    }

    // Força navegação (evita PJAX/handlers bloquearem clique)
    function bindNavLinks(scope){
      scope.querySelectorAll('a.qc-go').forEach(a=>{
        a.addEventListener('click', (e)=>{
          e.preventDefault();
          const u = a.getAttribute('data-url') || a.href;
          const type = a.getAttribute('data-type') || 'link';

          // tracking
          clarityEvent('quiz_click', { quiz_click_type: type, quiz_goal_label: (lastGoal||'') });
          ga4Event('quiz_click', { click_type: type, goal: (lastGoal||'') });

          // fecha drawer antes de navegar (mobile-friendly)
          try{ closeDrawer(); }catch(_){}

          if(type === 'whatsapp'){
            if(OPEN_WHATS_NEW_TAB){
              window.open(u, '_blank', 'noopener');
            }else{
              window.location.href = u;
            }
          }else{
            window.location.href = u;
          }
        }, { passive:false });
      });
    }

    function start(){
      lastGoal = null;
      elWrap.innerHTML = '';
      clarityEvent('quiz_caps_start');
      ga4Event('quiz_caps_start');

      addMsg('Oi! Eu te ajudo a encontrar sua suplementação em <b>cápsulas</b> 💊✨');
      const t = addTyping();
      setTimeout(()=>{
        removeTyping(t);
        addMsg('Qual objetivo você quer priorizar hoje?');
        quickReplies([
          { id:'ossea_articular', rotulo:'🦴 Óssea/Articular' },
          { id:'cardiovascular',  rotulo:'❤️ Cardiovascular' },
          { id:'mental_foco',     rotulo:'🧠 Foco & Concentração' },
          { id:'energia_vitalidade', rotulo:'⚡ Energia & Vitalidade' },
          { id:'memoria_concentracao', rotulo:'📚 Memória' },
          { id:'termogenico',     rotulo:'🔥 Termogênico' }
        ], onPick);
      }, 320);
    }

    function onPick(opt){
      const bloco = MAPA[opt.id];
      lastGoal = bloco && bloco.rotulo ? bloco.rotulo : opt.rotulo;

      addMsg(opt.rotulo, 'user');
      clarityEvent('quiz_caps_goal', {quiz_goal: opt.id, quiz_goal_label: lastGoal});
      ga4Event('quiz_caps_goal', {goal_id: opt.id, goal_label: lastGoal});

      const t = addTyping();
      setTimeout(()=>{
        removeTyping(t);

        const itens = (bloco.produtos||[]).map(p=>{
          const url = withUtm(p.url || '');
          const safeUrl = String(url).replace(/"/g, '&quot;');
          return `<li>• ${p.nome} — <a href="${safeUrl}" class="qc-go" data-type="product" data-url="${safeUrl}" rel="nofollow">ver</a></li>`;
        }).join('');

        // WhatsApp dinâmico
        const whatsUrl = buildWhatsUrl(lastGoal, bloco.produtos);
        const safeWhats = String(whatsUrl).replace(/"/g, '&quot;');

        const html = `
          <p>Fechado! Para <b>${bloco.rotulo}</b>, recomendo:</p>
          <ul>${itens}</ul>
          <p>
            <a class="quizchat__cta qc-go"
               href="${safeWhats}"
               data-url="${safeWhats}"
               data-type="whatsapp"
               rel="noopener">
              Dúvida? Clique e fale com o farmacêutico
            </a>
          </p>
          <small style="opacity:.8">*Sugestão orientativa. Em caso de dúvida, consulte um profissional.</small>
        `;

        const msg = addMsg(html, 'bot');
        bindNavLinks(msg);

        clarityEvent('quiz_caps_complete', {quiz_goal: opt.id, quiz_goal_label: lastGoal});
        ga4Event('quiz_caps_complete', {goal_id: opt.id, goal_label: lastGoal});
      }, 340);
    }

    elReset.addEventListener('click', start);
    start();
  }

})();
</script>
