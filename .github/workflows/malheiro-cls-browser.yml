name: Malheiro - CLS Browser Audit

on:
  pull_request:
    branches: [master]
    paths:
      - 'Malheiro/**'
      - '.github/workflows/malheiro-cls-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cls-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify surgical patches and original CDN image URLs
        run: |
          node Malheiro/scripts/validar-cls-v2.mjs
          node Malheiro/scripts/validar-homologacao.mjs
          node Malheiro/scripts/validar-cabecalho.mjs

      - name: Install Playwright Chromium for lab tests
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Measure live storefront (no writes)
        continue-on-error: true
        run: node Malheiro/scripts/medir-cls-loja-real.mjs

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: malheiro-cls-live-browser
          path: Malheiro/auditoria/cls-live-browser-resultados.json
          if-no-files-found: warn
